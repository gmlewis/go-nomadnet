# The terminal colors the appliance publishes for Termux.
#
# It is the operator's own terminal theme: a black background, a bright green
# default foreground, and the gruvbox 16-color palette. The client draws most of
# its chrome — frame borders, pane titles, the key hints along the bottom — in
# the terminal's *default* colors, and its accents from the palette, so the same
# client under a Termux with its stock white-on-black palette renders the same
# interface in different colors. This file is what makes the two match.
#
# Termux reads it from ~/.termux/colors.properties. The client installs it there
# the first time it runs in Termux, and never replaces one that is already there.
#
# The format is Termux's own: one "key = value" per line, each color written as
# "#rrggbb". Termux accepts colors.properties keys "foreground", "background",
# "cursor", and "color0" through "color255" — there is no bright/dim split, so
# the sixteen entries below are the sixteen the client can ask for by name.

foreground = #00ff00
background = #000000
cursor = #00ff00

color0 = #1d2021
color1 = #cc241d
color2 = #98971a
color3 = #d79921
color4 = #458588
color5 = #b16286
color6 = #689d6a
color7 = #a89984
color8 = #7c6f64
color9 = #fb4934
color10 = #b8bb26
color11 = #fabd2f
color12 = #83a598
color13 = #d3869b
color14 = #8ec07c
color15 = #fbf1c7
