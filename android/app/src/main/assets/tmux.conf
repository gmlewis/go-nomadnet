# The tmux configuration the appliance publishes for Termux.
#
# It is the operator's own ~/.tmux.conf, so a pane on the tablet looks like a
# pane on the desktop: the status bar on top with blue accents, windows numbered
# from one, and true-color escape sequences passed through instead of being
# downsampled to 256 colors.
#
# The client installs this file as ~/.tmux.conf the first time it runs in Termux,
# and never replaces one that is already there. tmux itself is a Termux package:
#
#   pkg install tmux

# Enable true-color (24-bit) passthrough for terminals that support it.
# Without this, tmux downsamples true-color escape sequences to 256 colors.
set -ga terminal-overrides ",*256col*:Tc"

# The terminal name a pane's programs are told they are running under. tmux
# advertises that name's capabilities to them, so it has to be one whose
# definition includes RGB, and not the bare "screen" that older tmux versions
# default to. Termux's terminfo carries it.
set -g default-terminal "tmux-256color"

# Accept the OSC 52 "set clipboard" escape from applications and forward it to
# the outer terminal, so text copied inside a pane (a TUI's drag-select or
# double-click copy, e.g. gonomadnet) reaches the clipboard of the machine the
# user actually types on — including panes running apps on remote hosts over
# ssh, where the escape is the only route back.
#
# tmux's default, "external", silently DROPS an application's OSC 52 (it only
# sets the clipboard for tmux's own copy-mode selections); "on" is the only
# value that lets applications create paste buffers with that escape.
set -g set-clipboard on

# Status bar: on top, blue accents, windows numbered from 1
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# Indexing
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# True color inside panes: the terminal advertises RGB, so programs colorize
# alike
set -as terminal-overrides ",*:RGB"
